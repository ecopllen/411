services:
  - type: web
    name: dreamy-birthday-planner
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: ADMIN_INITIAL_USERNAME
        value: kieutram
      - key: ADMIN_INITIAL_PASSWORD
        value: 123456789
      - key: SESSION_SECRET
        generateValue: true
